# keyspec targets for the Luz reference implementations (packages/keyspec/README.md).
#
# scenarios/luz.yaml is the shared conformance suite: every variant runs it. A variant's own
# file adds what depends on its letters. Positions are Luz positions (0-41), the key order of
# the LAYOUT_split_3x6_3 every Luz board shares; each runner maps them onto that board's
# own matrix.

runners:
  qmk:                  # QMK's host unit-test harness
    # qmk_home: ~/qmk_firmware   # default: $QMK_HOME, then `qmk config user.qmk_home`
    layout: LAYOUT_split_3x6_3
    tolerance_ms: 0     # simulated clock: reports land exactly on time
    settle_ms: 1000     # keep recording this long after the last step
    setups:             # fixtures scenarios ask for with `setup:` (the luz/host_os module)
      linux:
        includes: [host_os.h]
        code: "host_os_set(HOST_OS_LINUX);"
      macos:
        includes: [host_os.h]
        code: "host_os_set(HOST_OS_MACOS);"

targets:
  - keymap: luz_for_qwerty
    keyboard: kaly/kaly42
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_qwerty.yaml]
  - keymap: luz_for_qwerty
    keyboard: 42keebs/cantor_pro/v3/left
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_qwerty.yaml]
  - keymap: luz_for_gallium
    keyboard: kaly/kaly42
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_gallium.yaml]
  - keymap: luz_for_gallium
    keyboard: 42keebs/cantor_pro/v3/left
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_gallium.yaml]
  - keymap: luz_for_enthium
    keyboard: kaly/kaly42
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_enthium.yaml]
  - keymap: luz_for_enthium
    keyboard: 42keebs/cantor_pro/v3/left
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_enthium.yaml]
  - keymap: luz_for_colemak_dh
    keyboard: kaly/kaly42
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_colemak_dh.yaml]
  - keymap: luz_for_colemak_dh
    keyboard: 42keebs/cantor_pro/v3/left
    scenarios: [scenarios/luz.yaml, scenarios/luz_for_colemak_dh.yaml]
