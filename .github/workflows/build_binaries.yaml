name: Build QMK firmware

on:
  push:
    branches: [main]      # CI build check on main (no release)
    tags: ['v*']          # versioned release on tag push
  pull_request:           # every PR, including stacked ones (base != main); the
                          # required status checks gate merges into main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The steps of QMK's reusable userspace build (qmk/.github qmk_userspace_build.yml), which
  # can only build a userspace at the repository root; ours is packages/qmk.
  build:
    name: 'Firmware build'
    runs-on: ubuntu-latest
    container: ghcr.io/qmk/qmk_cli:latest
    defaults:
      run:
        working-directory: packages/qmk
    steps:
      - uses: actions/checkout@v4
      - name: Check out QMK
        uses: actions/checkout@v4
        with:
          repository: qmk/qmk_firmware
          ref: master
          path: qmk_firmware
          submodules: recursive
      - name: Configure the QMK CLI
        run: |
          pip install -r "$GITHUB_WORKSPACE/qmk_firmware/requirements.txt"
          qmk config userspace_compile.parallel=$(nproc)
          qmk config user.qmk_home="$GITHUB_WORKSPACE/qmk_firmware"
          qmk config user.overlay_dir="$GITHUB_WORKSPACE/packages/qmk"
          qmk userspace-doctor
      - name: Materialize the keymap symlinks, and add the Cantor Pro to QMK
        run: |
          find keyboards -type l | while read link; do
            target=$(readlink -f "$link") || { echo "Unresolvable symlink: $link" >&2; exit 1; }
            rm "$link"
            cp -r "$target" "$link"
          done
          cp -r keyboards/42keebs "$GITHUB_WORKSPACE/qmk_firmware/keyboards/"
      - name: Build every target in qmk.json
        run: qmk userspace-compile -e DUMP_CI_METADATA=yes -p
      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: Firmware
          path: |
            packages/qmk/*.bin
            packages/qmk/*.hex
            packages/qmk/*.uf2

  # Behavioural keymap tests (keyspec, packages/keyspec): the Luz scenarios in packages/qmk/tests/,
  # replayed in QMK's host test harness against the same QMK ref as the build above.
  test:
    name: 'Keymap tests'
    runs-on: ubuntu-latest
    env:
      QMK_HOME: ${{ github.workspace }}/qmk_firmware
    steps:
      - uses: actions/checkout@v4
      - name: Check out QMK (test harness submodules only)
        run: |
          git clone --depth 1 --branch master https://github.com/qmk/qmk_firmware.git qmk_firmware
          git -C qmk_firmware submodule update --init --depth 1 lib/googletest lib/printf
          # Same as the build job: `qmk info` only resolves the Cantor Pro from qmk_firmware
          cp -rL packages/qmk/keyboards/42keebs qmk_firmware/keyboards/
      - uses: astral-sh/setup-uv@v6
      - name: Install the QMK CLI
        run: uv tool install qmk
      - name: Run the scenarios
        run: uv run --project packages/keyspec keyspec -c packages/qmk/tests/keyspec.yaml run --no-color --junit keyspec.xml
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyspec-junit
          path: keyspec.xml
          if-no-files-found: ignore

  # Versioned GitHub release, only on a v* tag. Pulls the firmware the build job produced
  # and the changelog section from CHANGELOG.md (no rolling "latest" release any more).
  release:
    name: 'Tagged release'
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Download built firmware
        run: gh run download "${{ github.run_id }}" --name Firmware --dir firmware
      - name: Publish release from CHANGELOG.md
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          # Body: lines after the matching "## v<tag> …" heading, up to the next "## v" heading.
          awk -v tag="$tag" '/^## v/{ if (g) exit; if ($2==tag) { g=1; next } } g { print }' CHANGELOG.md > body.md
          # Title: the heading text without the leading "## " (keeps any " — Codename").
          title=$(awk -v tag="$tag" '/^## v/ && $2==tag { sub(/^## /,""); print; exit }' CHANGELOG.md)
          if [ ! -s body.md ] || [ -z "$title" ]; then
            echo "::error::No CHANGELOG.md section found for $tag"; exit 1
          fi
          mapfile -t fw < <(find firmware -type f \( -name '*.uf2' -o -name '*.bin' -o -name '*.hex' \) | sort)
          if [ "${#fw[@]}" -eq 0 ]; then echo "::error::no firmware artifacts found"; exit 1; fi
          echo "Releasing $tag (\"$title\") with ${#fw[@]} firmware file(s):"; printf '  %s\n' "${fw[@]}"
          gh release create "$tag" --title "$title" --notes-file body.md "${fw[@]}"
